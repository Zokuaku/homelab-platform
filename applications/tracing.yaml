apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tracing
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  # Tempo (trace store) + OpenTelemetry Collector (OTLP gateway) — the trace leg of
  # EVOLUTION #89 (bl-019). Apps send OTLP to the collector; the collector batches to Tempo;
  # Grafana queries tempo:3200.
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: tempo
      targetRevision: 1.24.4
      helm:
        valueFiles:
          - $values/platform/tracing/tempo-values.yaml
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      targetRevision: 0.170.0
      helm:
        valueFiles:
          - $values/platform/tracing/otel-values.yaml
    - repoURL: https://github.com/Zokuaku/homelab-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: tracing
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
