apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"   # after Vault (wave 1); ClusterSecretStore added in Stage D
spec:
  project: default
  # Multi-source: upstream External Secrets Operator Helm chart (pinned) + vendored values from git.
  sources:
    # External chart pull depends on the argocd-repo-server ndots:1 fix — see the note in
    # applications/vault.yaml and platform/argocd/repo-server-dns-patch.yaml. (Trailing-dot
    # FQDN in repoURL does not work here — Argo normalizes it away.)
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.8.0
      helm:
        valueFiles:
          - $values/platform/external-secrets/values.yaml
    - repoURL: https://github.com/Zokuaku/homelab-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # ESO CRDs are large; server-side apply avoids annotation size limits
