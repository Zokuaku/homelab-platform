apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"   # after external-secrets: needs the ExternalSecret CRD + vault-backend store
spec:
  project: default
  source:
    repoURL: https://github.com/Zokuaku/homelab-platform.git
    targetRevision: main
    path: platform/monitoring-config
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
