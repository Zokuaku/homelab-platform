apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"   # after external-secrets operator (wave 2) + Vault (wave 1)
spec:
  project: default
  # Plain kustomize: the ClusterSecretStore that binds ESO -> the in-cluster Vault backend.
  # Kept separate from the ESO Helm app (mirrors the argocd-config split) so the wiring is
  # diffable and its lifecycle is independent of the operator chart.
  source:
    repoURL: https://github.com/Zokuaku/homelab-platform.git
    targetRevision: main
    path: platform/external-secrets-config
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
