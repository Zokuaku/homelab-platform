apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp-readonly
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Zokuaku/homelab-platform.git
    targetRevision: main
    path: platform/mcp-readonly
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false      # RBAC + live token secret — never auto-prune access to the cluster
      selfHeal: true
    syncOptions:
      - ServerSideApply=true   # adopt the existing kubectl-applied objects without ownership fights
