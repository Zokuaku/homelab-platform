apiVersion: v1
kind: Service
metadata:
  name: argocd-server
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: argocd
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
      nodePort: 30080     # pinned -> Traefik route argocd.example.com
    - name: https
      port: 443
      targetPort: 8080
      protocol: TCP
      nodePort: 30663     # unused (server runs insecure); pinned to match live, avoid drift
