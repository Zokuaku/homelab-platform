# GitLab Runner authentication token (EVOLUTION ev-114). The group runner is created ONCE in the
# GitLab UI (group homelab -> Build -> Runners, tag estate-k8s); its token is written by the
# human via services/vault/scripts/vault-kv-put.sh into secret/platform/gitlab-runner
# (property runner-token) and projected here. Git holds only this reference, never a value.
# POLICY PAIR RULE (td_vault_005): the eso-read Vault policy enumerates per-consumer paths —
# the secret/data + secret/metadata pair for platform/gitlab-runner lands in the SAME change
# (services/vault/scripts/add-eso-gitlab-runner-path.sh), or ESO gets a MISLEADING 403.
# Rotate: reset the token in the GitLab UI -> vault-kv-put.sh overwrites -> ESO re-syncs within
# refreshInterval (or force: kubectl annotate externalsecret -n gitlab-runner
# gitlab-runner-token force-sync=$(date +%s) --overwrite), then restart the runner deployment.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-runner-token
  namespace: gitlab-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gitlab-runner-secret        # the chart's runners.secret (platform/gitlab-runner/values.yaml)
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        runner-registration-token: ""   # legacy key the chart still reads; empty on purpose (docs: leave as "")
        runner-token: "{{ .runner_token }}"
  data:
    - secretKey: runner_token
      remoteRef:
        key: platform/gitlab-runner
        property: runner-token
