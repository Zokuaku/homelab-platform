# snmp_exporter module `mikrotik_afda` (estate EVOLUTION ev-206, 2026-11-10): what RouterOS 7.25 added to
# MIKROTIK-MIB and the image's bundled `mikrotik` module (generated from an older MIB) does not walk -
#   mtxrIpPool*            the DHCP address pools: total / used / available, by pool name
#   mtxrRemoteCap*         the Wi-Fi controller's access points: state and version
#   mtxrWifiInterfaces*    each radio interface and the frequency it is on
#   mtxrWifiRegistration*  each Wi-Fi client: signal, rates, bytes, uptime - labelled with its radio, network
#                          (SSID), band and how it authenticated. The client's hardware address is a label:
#                          Prometheus and Grafana are admin tools on the house network; it goes nowhere else.
#   mtxrInterfaceStats{Rx,Tx}Drop  per-interface drop counters
# Proven against the live router on 2026-11-10 with the exporter's own image: 381 series in 0.2 s; together
# with the three bundled modules 3,785 series in 3.9 s.
#
# TO REGENERATE (a new RouterOS with new tables, or a different selection): put MIKROTIK-MIB of the running
# version (https://download.mikrotik.com/routeros/<version>/mikrotik.mib) and the net-snmp base MIBs it
# imports (SNMPv2-SMI, SNMPv2-TC, SNMPv2-CONF, INET-ADDRESS-MIB, ...) in ./mibs, generator.yml beside it, then
#   docker run --rm -v "$PWD:/work" -w /work -e MIBDIRS=/work/mibs prom/snmp-generator:v0.28.0 \
#     generate --no-fail-on-parse-errors -m /work/mibs -g /work/generator.yml -o /work/snmp-afda.yml
# and paste the `modules:` part below (the generator's placeholder `auths:` block is dropped - the real
# auth is rendered by externalsecret-snmp-exporter.yaml). Bump `afda/module-revision` in snmp-exporter.yaml
# so the pod restarts and reads it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: snmp-exporter-module-afda
  namespace: monitoring
  labels:
    app.kubernetes.io/name: snmp-exporter
