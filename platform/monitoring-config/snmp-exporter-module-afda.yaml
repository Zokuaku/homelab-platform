        - name: mtxrInterfaceStatsRxDrop
          oid: 1.3.6.1.4.1.14988.1.1.14.1.1.55
          type: counter
          help: ' - 1.3.6.1.4.1.14988.1.1.14.1.1.55'
          indexes:
          - labelname: mtxrInterfaceStatsIndex
