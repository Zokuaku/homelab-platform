    # MIKROTIK-MIB of RouterOS 7.25.1. Do not edit by hand - regenerate (the header of this file).
    modules:
      mikrotik_afda:
        walk:
        - 1.3.6.1.4.1.14988.1.1.14.1.1.2
        - 1.3.6.1.4.1.14988.1.1.14.1.1.55
