  generator.yml: |
    ---
    # Generator input for the module the image's bundled `mikrotik` module does not carry: the tables
    # RouterOS 7.25 added to MIKROTIK-MIB (address pools, the Wi-Fi controller's access points, radios
    # and clients) and the per-interface drop counters. Estate ev-206.
    auths:
      placeholder:
        version: 2
    modules:
      mikrotik_afda:
        walk:
          - mtxrIpPoolTable
          - mtxrRemoteCapTable
          - mtxrWifiInterfaces
          - mtxrWifiRegistrationTable
          - mtxrInterfaceStatsName
          - mtxrInterfaceStatsRxDrop
          - mtxrInterfaceStatsTxDrop
        lookups:
          - source_indexes: [mtxrIpPoolIndex]
            lookup: mtxrIpPoolName
            drop_source_indexes: true
          - source_indexes: [mtxrRemoteCapId]
            lookup: mtxrRemoteCapAddress
          - source_indexes: [mtxrWifiInterfacesId]
            lookup: mtxrWifiInterfacesName
          - source_indexes: [mtxrWifiRegistrationInterface]
            lookup: mtxrWifiInterfacesName
          - source_indexes: [mtxrWifiRegistrationMacAddress, mtxrWifiRegistrationInterface]
            lookup: mtxrWifiRegistrationSsid
          - source_indexes: [mtxrWifiRegistrationMacAddress, mtxrWifiRegistrationInterface]
            lookup: mtxrWifiRegistrationBand
          - source_indexes: [mtxrWifiRegistrationMacAddress, mtxrWifiRegistrationInterface]
            lookup: mtxrWifiRegistrationAuthType
          - source_indexes: [mtxrInterfaceStatsIndex]
            lookup: mtxrInterfaceStatsName
            drop_source_indexes: true
        overrides:
          # label-only strings and things that are not worth a series each
          mtxrIpPoolName: {ignore: true}
          mtxrRemoteCapAddress: {ignore: true}
          mtxrRemoteCapIdentity: {ignore: true}
          mtxrRemoteCapBoardName: {ignore: true}
          mtxrRemoteCapSerial: {ignore: true}
          mtxrRemoteCapBaseMac: {ignore: true}
          mtxrRemoteCapCommonName: {ignore: true}
          mtxrWifiInterfacesName: {ignore: true}
          mtxrWifiInterfacesSsid: {ignore: true}
          mtxrWifiInterfacesCurrentChannel: {ignore: true}
          mtxrWifiRegistrationSsid: {ignore: true}
          mtxrWifiRegistrationBand: {ignore: true}
          mtxrWifiRegistrationAuthType: {ignore: true}
          mtxrWifiRegistrationLastActivity: {ignore: true}
          mtxrWifiRegistrationTxPackets: {ignore: true}
          mtxrWifiRegistrationRxPackets: {ignore: true}
          mtxrWifiRegistrationTxBitsPerSecond: {ignore: true}
          mtxrWifiRegistrationRxBitsPerSecond: {ignore: true}
          mtxrWifiRegistrationVlanId: {ignore: true}
          mtxrWifiRegistrationAuthorized: {ignore: true}
          mtxrInterfaceStatsName: {ignore: true}
