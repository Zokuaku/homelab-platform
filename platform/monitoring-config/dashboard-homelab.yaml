                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 14
                  },
                  {
                    "color": "green",
                    "value": 30
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 16,
          "type": "stat",
          "title": "pve1 ZFS pools",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 8,
            "y": 38
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "node_zfs_zpool_state{job=\"proxmox-node\", state=\"online\"}",
              "refId": "A",
              "legendFormat": "{{zpool}}",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name",
            "justifyMode": "center",
            "orientation": "auto",
            "wideLayout": true
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "online",
                      "color": "green"
                    },
                    "0": {
                      "text": "NOT ONLINE",
                      "color": "red"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
