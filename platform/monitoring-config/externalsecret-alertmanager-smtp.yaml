# Alertmanager's mail credential (estate EVOLUTION ev-139). The value lives in Vault at
# secret/platform/alertmanager-smtp (key: password) - the app password of the estate's dedicated
# alerts account, the channel ev-56 decided; its own password, not the one Proxmox holds.
# Seeded by the operator with services/vault/scripts/vault-kv-put.sh after
# add-eso-alertmanager-path.sh added the path to the eso-read policy (STOP - authorised human
# required: both need the Vault admin token). Git holds only this reference.
#
# ORDER: the Secret this renders is MOUNTED into the Alertmanager pod
# (platform/monitoring/values.yaml, alertmanagerSpec.secrets) and read as a file. If the Vault
# key does not exist this reports SecretSyncedError, no Secret is made, and the Alertmanager pod
# cannot start - seed the key before merging a change that adds the mount.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-smtp
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: alertmanager-smtp
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: platform/alertmanager-smtp
        property: password
