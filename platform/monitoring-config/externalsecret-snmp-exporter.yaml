# The router's SNMPv3 credential for snmp_exporter (estate EVOLUTION ev-155, formalized bl-136).
# The values live in Vault at secret/platform/snmp-exporter (keys: auth_password, priv_password) -
# the passwords of the router's read-only SNMPv3 user 'snmp-ro' (SHA / AES), entered on the router
# by the operator in Winbox and seeded with services/vault/scripts/vault-kv-put.sh after
# add-eso-snmp-exporter-path.sh added the path to the eso-read policy (STOP - authorised human
# required: both need the Vault admin token). Git holds only this reference.
#
# WHY A TEMPLATE: ESO renders the WHOLE auth.yml, so the Secret is a finished config file the
# exporter reads as-is. The exporter's own --config.expand-environment-variables did NOT
# substitute an SNMP credential in the s88 test (the router silently ignored the literal
# placeholder; with the value written out the same scrape worked) - so it is not relied on.
# The passwords are letters and digits only: they sit inside YAML.
#
# ORDER: seed the Vault key BEFORE merging - without it this reports SecretSyncedError, no Secret
# is made, and the snmp-exporter pod waits in ContainerCreating (it mounts the Secret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: snmp-exporter-auth
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: snmp-exporter-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        auth.yml: |
          auths:
            router_v3:
              version: 3
              username: snmp-ro
              security_level: authPriv
              auth_protocol: SHA
              password: "{{ .auth_password }}"
              priv_protocol: AES
              priv_password: "{{ .priv_password }}"
  data:
    - secretKey: auth_password
      remoteRef:
        key: platform/snmp-exporter
        property: auth_password
    - secretKey: priv_password
      remoteRef:
        key: platform/snmp-exporter
        property: priv_password
