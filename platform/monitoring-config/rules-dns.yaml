# Alert rules for the house's internal resolvers (estate EVOLUTION ev-152, s88 2026-10-17).
# Scraped by blackbox-dns.yaml (jobs dns-internal, dns-public, dns-soa; instance = resolver:53).
# Routing: critical and warning are mailed.
#
# Since ev-151 the router has NO public DNS fallback - two internal resolvers only:
#   one down  = the house still resolves, the redundancy is gone   -> warning
#   both down = no DNS for the house                               -> critical
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dns
  namespace: monitoring
  annotations:
    # This app (sync-wave 3) runs before the chart that owns the PrometheusRule CRD (wave 4).
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  groups:
    - name: dns
      rules:
        - alert: DNSResolverDown
          # A bind9 reconfig or container recreate takes seconds; 3 minutes is not a reload.
          expr: probe_success{job="dns-internal"} == 0
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "Internal resolver {{ $labels.instance }} not answering example.com"
            description: >-
              {{ $labels.instance }} has failed the internal-name probe for 3 minutes. The house
              still resolves through the other resolver, but there is no redundancy left. bind9 is
              .53, bind9-b is .54, both on pve1: ssh root@<ip> 'docker ps;
              docker logs --tail 30 dns' (services/bind9/docs/RUNBOOK.md).
        - alert: DNSAllResolversDown
          expr: sum(probe_success{job="dns-internal"}) == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "BOTH internal resolvers down - no DNS for the house"
            description: >-
              Neither .53 nor .54 answers example.com, and the router has no public fallback
              (ev-151). Most likely pve1 itself. Fastest way back for the house: on the router,
              /ip dns set servers=192.0.2.53,192.0.2.54,198.51.100.1 (a public resolver) until a resolver is up.
        - alert: DNSPublicResolutionFailing
          # serve-stale (ev-152) answers recently used names during an upstream outage, so this
          # fires only once even the cache cannot answer - a real, house-visible failure.
          expr: probe_success{job="dns-public"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} cannot resolve public names"
            description: >-
              The resolver answers internal names but not example.com: its DNS-over-TLS upstream
              (Cloudflare / Quad9, tcp 853) is unreachable or rejecting it. Check the WAN, then
              'docker logs dns | grep -i tls' on the resolver (a provider certificate change shows
              as 'TLS peer certificate verification failed').
        - alert: DNSSecondaryBehind
          # NOTIFY normally brings bind9-b level within seconds; the zone refresh is 12 h.
          expr: max(probe_dns_serial{job="dns-soa"}) - min(probe_dns_serial{job="dns-soa"}) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "bind9-b's example.com serial is behind bind9's for 30 minutes"
            description: >-
              The secondary has not picked up the primary's latest zone. Check the transfer on
              .54: docker logs dns 2>&1 | grep -i transfer - 'bad key' or REFUSED means the two
              xfer.key files differ or the primary lost allow-transfer (bind9 RUNBOOK 5a).
    # The resolvers' own view (estate ev-193 step I, s111): job dns-unbound, scrapeconfig-dns.yaml.
    # The probes above say whether a resolver ANSWERS; these say how it is doing while it does.
    - name: dns-stack
      rules:
        - alert: DNSResolverMetricsDown
          expr: up{job="dns-unbound"} == 0 or unbound_up{job="dns-unbound"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }}: Unbound's counters cannot be read"
            description: >-
              Either the exporter on the resolver is not answering (systemctl status
              dns-unbound-exporter) or it answers and unbound-control does not (docker ps: is
              dns-unbound up and healthy?). If DNSResolverDown is NOT firing the house still
              resolves through this resolver - it is running blind, not down.
        - alert: DNSUpstreamFailing
          expr: >-
            sum by (instance) (rate(unbound_answers_total{job="dns-unbound", rcode="SERVFAIL"}[10m]))
            / sum by (instance) (rate(unbound_queries_total{job="dns-unbound"}[10m])) > 0.05
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }}: more than 5% of answers are SERVFAIL"
            description: >-
              One answer in twenty has failed for 15 minutes. Usual causes, in order: the
              DNS-over-TLS upstreams (Cloudflare, Quad9, tcp 853) unreachable or refusing the
              certificate - docker logs dns-unbound | grep -iE "tls|ssl|error"; a zone failing
              DNSSEC validation for everyone (not ours to fix); the example.com zone file not
              loading after a zone deploy - unbound-control list_auth_zones.
        - alert: DNSServingStale
          expr: increase(unbound_expired_served_total{job="dns-unbound"}[10m]) > 50
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} is answering from expired cache"
            description: >-
              Serve-stale is doing its job: the upstreams are not answering in time, so recently
              used names are served from the expired cache (for up to 12 hours) and names never
              asked before fail. Check the WAN and the upstreams; this clears by itself when
              they answer again.
