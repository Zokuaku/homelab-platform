# Grafana admin credential (EVOLUTION #89). The value lives in Vault at secret/platform/grafana,
# seeded once by services/vault/scripts/seed-grafana-admin.sh (STOP — authorised human required:
# writing to Vault needs the admin token, the operator's custody). Git holds only this reference.
# Until the key is seeded this reports SecretSyncedError and the Grafana pod waits on the
# secret — the rest of the monitoring stack comes up regardless.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: platform/grafana
        property: user
    - secretKey: admin-password
      remoteRef:
        key: platform/grafana
        property: password
