# The shipping credentials are SECRETS: a cloud storage credential, the Proxmox sftp private key,
# and the pinned Proxmox host key. They live in Vault at secret/platform/vault-backup and are
# projected here by ESO — git holds only this reference, never the values
# (context/SECRETS_STANDARD.yaml invariant: never_plaintext_in_git).
#
# Dogfooding note: the backup path depends on Vault to fetch its own shipping credential. That is
# fine by design — the credential is only needed to WRITE a backup. RESTORE needs just the .age
# artifact plus the offline age key, so a dead Vault never blocks recovery.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-backup-rclone
  namespace: vault
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: vault-backup-rclone
    creationPolicy: Owner
  data:
    - secretKey: rclone.conf
      remoteRef:
        key: platform/vault-backup
        property: rclone.conf
    - secretKey: ssh_key          # ed25519 private key for the vaultbackup@proxmox sftp account
      remoteRef:
        key: platform/vault-backup
        property: ssh_key
    # known_hosts deliberately NOT here: a host PUBLIC key is not a secret. It lives in the
    # vault-backup-scripts ConfigMap (git) and is merged into /etc/rclone by a projected volume,
    # so fixing a rotated or mis-scanned host key is a git commit rather than a root-token write.
