# Authentication token of the `portfolio` group runner (EVOLUTION ev-45 Track B, sitting 1).
# The runner is created ONCE in the GitLab UI (group portfolio -> Build -> Runners, tag
# portfolio-k8s); its token is written by the human via services/vault/scripts/vault-kv-put.sh
# into secret/platform/gitlab-runner-portfolio (property runner-token) and projected here. Git
# holds only this reference, never a value.
# POLICY PAIR RULE (td_vault_005): the eso-read Vault policy enumerates per-consumer paths — the
# secret/data + secret/metadata pair for platform/gitlab-runner-portfolio lands in the SAME
# change (services/vault/scripts/add-eso-gitlab-runner-portfolio-path.sh), or ESO gets a
# MISLEADING 403.
# Same Secret and ExternalSecret NAMES as the estate runner, in a different namespace: the shared
# values file (platform/gitlab-runner/values.yaml, runners.secret) names the Secret once.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-runner-token
  namespace: gitlab-runner-portfolio
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gitlab-runner-secret        # the chart's runners.secret (platform/gitlab-runner/values.yaml)
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        runner-registration-token: ""   # legacy key the chart still reads; empty on purpose (docs: leave as "")
        runner-token: "{{ .runner_token }}"
  data:
    - secretKey: runner_token
      remoteRef:
        key: platform/gitlab-runner-portfolio
        property: runner-token
