# kube-prometheus-stack values (EVOLUTION #89). Chart 88.3.0 pinned in applications/monitoring.yaml.
# Sized for the single-node k3s mgmt cluster (the k3s node, 8 vCPU / 24 Gi, shared with Ollama's
# cpu6/mem10Gi envelope) — modest requests, homelab retention. The node's root filesystem has ~18G free:
# PVCs across #89 total 14Gi thin-provisioned on local-path.

fullnameOverride: monitoring

# k3s runs controller-manager/scheduler/proxy/etcd INSIDE the k3s binary — their standalone
# metric endpoints don't exist; leaving these enabled creates permanently-down targets.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 15d                    # #89 decision (2026-08-17)
    # Select ServiceMonitors/Rules from ANY app regardless of Helm release label —
    # podinfo's monitor now, bl-083's generated PrometheusRules later.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 8Gi

# ALERT MAIL (estate ev-139, s81; D1-D4 decided 2026-10-12). The channel is the one ev-56
# chose and Proxmox already uses: mail from the dedicated alerts account to the operator's inbox.
#   WHAT IS MAILED: severity warning and critical. A critical repeats every 12 h while it
#   lasts, a warning every 24 h, and a 'resolved' mail follows. Everything else - severity
#   info, unlabelled alerts and the always-on Watchdog - goes to 'null' and is not mailed.
#   The chart's own rules mail too (D3): read what arrives, silence noise by name here.
#   THE PASSWORD is not in this file: Alertmanager reads it from a file in the Secret
#   alertmanager-smtp (platform/monitoring-config/externalsecret-alertmanager-smtp.yaml, from
#   Vault), mounted by alertmanagerSpec.secrets below at /etc/alertmanager/secrets/<name>/.
#   Read from chart 88.3.0's own values before this was written: config is a map merged over
#   the chart's default (its inhibit rules are kept; route and receivers are restated here in
#   full because a list replaces a list), and alertmanagerSpec.secrets mounts as described.
#   NOBODY WATCHES THE WATCHER (D4): if the cluster is down no mail is sent - estate bl-067.
alertmanager:
  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: 'smtp.example.com:587'
      smtp_from: 'alerts@example.com'
      smtp_auth_username: 'alerts@example.com'
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/password
      smtp_require_tls: true
    route:
      group_by: ['alertname', 'namespace', 'instance']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 24h
      receiver: 'null'
      routes:
        - receiver: 'null'
          matchers:
            - alertname = "Watchdog"
        - receiver: 'email'
          matchers:
            - severity = "critical"
          repeat_interval: 12h
        - receiver: 'email'
          matchers:
            - severity = "warning"
          repeat_interval: 24h
    receivers:
      - name: 'null'
      - name: 'email'
        email_configs:
          - to: 'operator@example.com'
            send_resolved: true
  alertmanagerSpec:
    secrets:
      - alertmanager-smtp
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi

grafana:
  admin:
    existingSecret: grafana-admin     # ESO-projected from Vault secret/platform/grafana
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: NodePort
    nodePort: 30300                   # Traefik -> .10:30300 (grafana.example.com, LAN-only)
  grafana.ini:
    server:
      root_url: https://grafana.example.com
  persistence:
    enabled: true
    type: pvc
    storageClassName: local-path
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.logging.svc.cluster.local:3100
    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo.tracing.svc.cluster.local:3200

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 64Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi
