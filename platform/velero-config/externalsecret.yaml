# Velero's S3 credential for the estate MinIO backup target (the Docker host :9000; bl-040).
# POLICY PAIR RULE (td_vault_005 — learned the hard way at first deploy): the eso-read Vault
# policy enumerates per-consumer paths; ANY new ExternalSecret consumer must add its
# secret/data/... + secret/metadata/... pair to eso-read in the same change, or ESO gets a
# MISLEADING 403 (Vault 403s unauthorized and nonexistent paths alike).
# The keypair lives in Vault at secret/platform/velero (two single-line properties, written by
# the human via services/vault/scripts/vault-kv-put.sh — single-line by design, that script
# prompts per-key). ESO assembles the AWS shared-credentials file Velero expects via the
# template below. Git holds only this reference, never values (SECRETS_STANDARD).
# Rotate: minio-setup-velero.sh mints a new key -> vault-kv-put.sh overwrites -> ESO re-syncs
# within refreshInterval (or force: kubectl annotate externalsecret -n velero
# velero-minio-credentials force-sync=$(date +%s) --overwrite).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-minio-credentials
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: velero-minio-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .access_key_id }}
          aws_secret_access_key={{ .secret_access_key }}
  data:
    - secretKey: access_key_id
      remoteRef:
        key: platform/velero
        property: aws_access_key_id
    - secretKey: secret_access_key
      remoteRef:
        key: platform/velero
        property: aws_secret_access_key
