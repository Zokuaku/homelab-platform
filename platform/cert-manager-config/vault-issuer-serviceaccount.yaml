# The account cert-manager logs in to Vault AS (estate EVOLUTION ev-170). It runs nothing: the
# controller asks the API for a short-lived token for it (audience vault) and presents that to
# Vault's kubernetes auth role 'cert-manager', bound to exactly this account. Vault grants the
# policy cert-manager-issue: sign under pki_int/sign/cluster-internal, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-issuer
  namespace: cert-manager
---
# The controller (service account cert-manager) may create tokens for vault-issuer only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-issuer-token-requester
  namespace: cert-manager
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["vault-issuer"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-issuer-token-requester
  namespace: cert-manager
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-issuer-token-requester
