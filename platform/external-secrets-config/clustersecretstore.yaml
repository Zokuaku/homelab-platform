# Cluster-wide ESO -> Vault backend (EVOLUTION #34).
# Auth: Kubernetes method. ESO mints a token for the external-secrets ServiceAccount
# (serviceAccountRef) and presents it to Vault's `eso` role, which maps to the least-privilege
# `eso-read` policy (read on secret/data/*). No standing credential is stored anywhere.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      # TRAILING DOT is deliberate: vault.vault.svc.cluster.local has 4 dots (< CoreDNS ndots:5),
      # so ESO's Go resolver would try search-appended variants first — and with example.com in
      # the pod search path + the *.example.com->Traefik wildcard, ...local.example.com resolves
      # to .20 (Traefik) before the absolute name. The trailing dot forces an absolute FQDN lookup.
      # (Node-level search-domain fix landed with td_vault_004; the dot stays as belt-and-braces.)
      # https since td_vault_001 — caBundle is the homelab-vault-ca public cert (safe in git).
      server: "https://vault.vault.svc.cluster.local.:8200"
      caBundle: "LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tClJFUExBQ0UtV0lUSC1USEUtQ0EtQ0VSVElGSUNBVEUtT0YtWU9VUi1WQVVMVC1MSVNURU5FUgotLS0tLUVORCBDRVJUSUZJQ0FURS0tLS0tCg=="
      path: "secret"          # KV v2 mount
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
            # td_vault_007: the eso Vault role pins audience=vault; ESO must mint its
            # SA token with a matching aud claim. MUST land together with the role
            # change (services/vault/scripts/tighten-eso-policy-and-audience.sh) —
            # either side alone fails the login.
            audiences:
              - vault
