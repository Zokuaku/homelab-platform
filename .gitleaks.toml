# .gitleaks.toml — k8s-manifests secrets gate (EVOLUTION ev-114 sitting 2, bl-016 Phase A).
# Default ruleset, NO allowlist: the full history (21 commits at filing, 2026-09-15) and the
# tree are clean. An allowlist entry names ONE path and its reason (the ClusterSecretStore
# caBundle — a public certificate — if the default rules ever flag it); never a directory-wide
# silence. The same file drives the local pre-commit hook and the CI job.
[extend]
useDefault = true

[[allowlists]]
description = "ONE exact value: the go.sum module hash (h1:) of github.com/aws/aws-sdk-go-v2/credentials v1.21.0, pinned in the vendored StudyLab lessons gpe-4-* (setup.sh) - a public checksum, not a secret; generic-api-key fires on the word 'credentials'. Value-only on purpose: an entry with paths makes 'gitleaks dir' skip the whole file before scanning, condition AND or not (seen in its debug log, 8.30.1, s114), so a path would hide a real secret in those files"
regexTarget = "secret"
regexes = ['''^OViwhqeipkQzSHuO2eQDUCdLrI6r3nzGxFUyM8GqnCs=$''']
