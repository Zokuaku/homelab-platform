# NodePort 30434 -> Traefik file-route ollama.example.com (websecure, wildcard cert,
# LAN-only ipAllowList — Ollama has NO auth of its own; never expose it past Traefik).
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ollama
spec:
  type: NodePort
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
      nodePort: 30434
